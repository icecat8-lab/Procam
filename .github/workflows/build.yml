name: Build and Release Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # จำเป็นต้องมีเพื่อให้บอทสร้าง Release ได้

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper (Fix Version)
      run: gradle wrapper --gradle-version 8.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: debug-v${{ github.run_number }}
        name: ProCamera Debug Build #${{ github.run_number }}
        body: "ไฟล์ติดตั้ง APK แบบ Debug กดดาวน์โหลดที่ Assets ด้านล่างได้เลย"
        draft: false
        prerelease: true
        files: app/build/outputs/apk/debug/app-debug.apk
        
