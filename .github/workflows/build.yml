name: Build Procam

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      create_release:
        description: 'Create GitHub Release with APK?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$SRC" "out/Procam-v${{ inputs.version }}.apk"
          ls -la out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: procam-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Procam v${{ inputs.version }}
          body: |
            ## Procam v${{ inputs.version }}

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.repository.updated_at }}

            ### Install
            1. Download `Procam-v${{ inputs.version }}.apk`
            2. Enable "Install from unknown sources"
            3. Tap APK to install

            ### Features
            - Camera2 API video recording
            - 1080p30 H.264 + AAC
            - Manual ISO / Shutter / WB
            - Multi-device support
          files: out/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
